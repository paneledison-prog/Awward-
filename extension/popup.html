<!doctype html>
<meta charset="utf-8">
<title>DesignDNA</title>
<style>
  /* One light theme, stated explicitly: the popup must not be inverted by a
     dark browser theme, or the card loses the contrast the design rests on. */
  :root {
    color-scheme: light;
    --card: #ffffff;
    --ink: #111113;
    --muted: #6b7280;
    --line: #e7e5e1;
    --field: #fbfaf9;
    --inset: #f6f5f3;
    --accent: #1a73e8;
    --danger: #c8372d;
    --radius-field: 12px;
  }

  * { box-sizing: border-box; }

  /* The popup window IS the card.
     A floating card inside the popup cannot work: Chrome draws its own white
     rounded window behind the document, so any ground colour around the card
     shows as a second panel behind the first — with the window's own corners
     and shadow. Painting the document itself as the card leaves nothing
     behind it to see. */
  html, body { background: var(--card); }

  body {
    width: 372px;
    margin: 0;
    padding: 20px;
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--card);
  }

  /* Identity row: mark, page title, link — mirrors the site card in the design. */
  .site { display: flex; gap: 12px; align-items: center; }
  .mark {
    flex: none; width: 44px; height: 44px; border-radius: 14px;
    background: #17181b; color: #fff;
    display: grid; place-items: center; font-size: 20px; line-height: 1;
  }
  .site-text { min-width: 0; }
  .site-name {
    margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .site-url {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .site-url svg { flex: none; }

  hr { margin: 18px 0; border: 0; border-top: 1px solid var(--line); }

  h2 { margin: 0; text-align: center; font-size: 19px; font-weight: 680; letter-spacing: -.015em; }
  .lede { margin: 6px 0 0; text-align: center; font-size: 14px; color: var(--muted); }

  label { display: block; margin: 0 0 6px; font-size: 12.5px; font-weight: 550; color: var(--muted); }
  .field + .field { margin-top: 14px; }

  input, select {
    width: 100%; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: var(--radius-field);
    background: var(--field); color: var(--ink);
    font: inherit; font-size: 13.5px;
  }
  input::placeholder { color: #a3a3a3; }
  input:focus, select:focus {
    outline: none; border-color: #c9c6c0; background: #fff;
    box-shadow: 0 0 0 3px rgba(17, 17, 19, .06);
  }

  /* Pill buttons: filled black is the commitment, outlined is the way out. */
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1; padding: 13px 16px; border-radius: 999px;
    font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease, opacity .12s ease;
  }
  .primary { border: 1px solid #17181b; background: #17181b; color: #fff; }
  .primary:hover:not(:disabled) { background: #000; }
  .secondary { border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .secondary:hover { border-color: #d6d3cd; background: #fbfaf9; }
  button:disabled { opacity: .45; cursor: default; }

  /* Inset checklist panel, as in the summary card. */
  .checklist {
    margin-top: 18px; padding: 16px 18px;
    background: var(--inset); border: 1px solid var(--line); border-radius: 16px;
    list-style: none;
  }
  .checklist li { display: flex; gap: 11px; align-items: center; font-size: 14px; }
  .checklist li + li { margin-top: 12px; }
  .tick {
    flex: none; width: 19px; height: 19px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
  }

  #status {
    margin: 14px 2px 0; min-height: 20px;
    font-size: 13px; color: var(--muted); text-align: center;
  }
  #status.err { color: var(--danger); }

  /* Sits inside the card, under a hairline — on the page ground it read as a
     second container beneath the first. */
  .version {
    margin: 18px -20px -4px; padding-top: 12px;
    border-top: 1px solid var(--line);
    text-align: center; font-size: 11px; color: #a3a3a3; letter-spacing: .02em;
  }

  [hidden] { display: none !important; }
</style>

<div class="card">
  <div class="site">
    <div class="mark" id="mark">✳</div>
    <div class="site-text">
      <p class="site-name" id="siteName">This page</p>
      <div class="site-url" id="siteUrl">
        <!-- Hugeicons Link02 (stroke rounded), inlined: the popup is plain HTML
             and cannot import the React renderer the app uses. -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.9961 17H16.9961C19.7575 17 21.9961 14.7614 21.9961 12C21.9961 9.23858 19.7575 7 16.9961 7H14.9961M8.99609 17H6.99609C4.23467 17 1.99609 14.7614 1.99609 12C1.99609 9.23858 4.23467 7 6.99609 7H8.99609"/>
          <path d="M8.49609 12H15.4961"/>
        </svg>
        <span id="siteHost">…</span>
      </div>
    </div>
  </div>

  <hr>

  <!-- Setup view -->
  <section id="setup">
    <h2>Extract this design</h2>
    <p class="lede">Measured in your browser, so nothing blocks it.</p>

    <div style="margin-top:18px">
      <div class="field">
        <label for="instance">DesignDNA instance</label>
        <input id="instance" type="url" placeholder="https://your-app.fly.dev" spellcheck="false">
      </div>

      <div class="field">
        <label for="shot">Screenshot</label>
        <select id="shot">
          <option value="full">Full page (scroll and stitch)</option>
          <option value="viewport">Visible area only</option>
          <option value="none">None (fastest)</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="go" class="primary">Extract</button>
    </div>
    <div id="status"></div>
    <p class="version">DesignDNA <span id="version">—</span></p>
  </section>

  <!-- Done view -->
  <section id="done" hidden>
    <h2>You're all set 🎉</h2>
    <p class="lede">Here's what you just captured.</p>

    <ul class="checklist" id="summary"></ul>

    <div class="actions">
      <button id="explore" class="primary">Explore</button>
      <button id="close" class="secondary">Close</button>
    </div>
    <p class="version">DesignDNA <span id="versionDone">—</span></p>
  </section>
</div>

<script src="popup.js"></script>
