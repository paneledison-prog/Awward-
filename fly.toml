# Fly.io.  fly launch --copy-config --now
#
# Two values here need changing at launch:
#   app            — must be globally unique; `fly launch` will prompt and rewrite it
#   primary_region — set to whichever region is near you (`fly platform regions`)
app = "awward-stoe"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  # MUST match http_service.internal_port below. The app listens on $PORT;
  # Fly routes external traffic to internal_port. If they disagree nothing is
  # listening where Fly is knocking, the deploy reports success, and every
  # health check fails with a bare "Request failed" — which is exactly what
  # `fly launch` produced when its scanner rewrote internal_port to 8080 and
  # left PORT at 3000. CI now asserts these two agree.
  PORT = "8080"
  EXTRACT_TIMEOUT_MS = "60000"
  SCREENSHOT_DIR = "/app/.screenshots"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Extraction holds a browser open for up to a minute; scaling to zero between
  # runs is fine, but a request must never land on a machine mid-shutdown.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    # These count open HTTP connections, not extractions — a distinction that
    # broke the app. An extraction holds an SSE progress stream open for its
    # whole run, so a single user browsing plus one extraction sailed past a
    # limit of 4, Fly started a second machine, and the follow-up request for
    # the result landed there. The job store is in memory, so the second
    # machine had never heard of the job and answered 404.
    #
    # The real constraint is CPU and memory during a render, not connection
    # count, so these are set high enough that ordinary use never triggers
    # scaling. Machine count is pinned to 1 at deploy instead.
    hard_limit = 50
    soft_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  # Chromium rendering a real page needs headroom; 512MB gets OOM-killed.
  memory = "1gb"
