name: Verify deployment

# Checks a already-deployed instance over plain HTTP. Deliberately separate from
# deploy.yml: it needs no Fly credentials, so it can be run by anyone, against
# any environment, without the ability to change it.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL of the deployed app'
        required: true
        default: 'https://awward-stoe.fly.dev'
        type: string
      target:
        description: 'Site for the deployed instance to extract'
        required: true
        default: 'https://example.com'
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Extract on the live instance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Reachability
        # Reported before the smoke run, and split by curl's exit code: "cannot
        # resolve" and "connected but wrong port" have completely different
        # fixes, and a single "not serving" message sends you after the wrong one.
        run: |
          URL="${{ inputs.url }}"
          HOST=$(echo "$URL" | sed -E 's|https?://||; s|/.*||')

          echo "── DNS $HOST ──"
          getent hosts "$HOST" || echo "(no DNS record)"

          echo "── HEAD $URL ──"
          set +e
          curl -sS -o /dev/null -D - --max-time 30 "$URL"
          rc=$?
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL")
          set -e
          echo "curl exit: $rc   http status: ${code:-none}"

          case "$rc" in
            0)
              if [ "$code" = "200" ]; then echo "serving"; exit 0; fi
              echo "::error::$URL answered $code. The app is reachable but not healthy — check application logs."
              exit 1 ;;
            6)
              echo "::error::$HOST does not resolve. The Fly app has no IP address allocated. Run: fly ips allocate-v4 --shared -a <app> && fly ips allocate-v6 -a <app>"
              exit 1 ;;
            7)
              echo "::error::$HOST resolves but refused the connection. Nothing is listening on the routed port — check that fly.toml's PORT matches internal_port, and that the machine is started (fly status)."
              exit 1 ;;
            28)
              echo "::error::$URL timed out. The machine may be stopped and failing to auto-start, or wedged during boot — check fly logs."
              exit 1 ;;
            *)
              echo "::error::$URL unreachable (curl exit $rc)."
              exit 1 ;;
          esac

      - name: Extract a real site on it
        run: node scripts/smoke-container.mjs "${{ inputs.url }}" "${{ inputs.target }}" --loose

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ inputs.url }}"
            echo ""
            echo "Extraction target: \`${{ inputs.target }}\`"
            echo "Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
